# Sample client configuration.
# See docs/endpoints.md and app/webservice.py for the full set of /asr query parameters.
#
# server_url / audio_dir can each be overridden without editing this file via the
# ASR_CLIENT_SERVER_URL / ASR_CLIENT_AUDIO_DIR env vars — this is how the "client" service in
# docker-compose.yml points at container paths/hostnames.

# Base URL of a running whisper-asr-webservice instance.
server_url: "http://localhost:9000"

# Directory to read input audio files from (relative to this file, or absolute).
# Transcription .txt files are written here too, next to each source audio file
# (same stem, .txt extension), replacing any file already there.
audio_dir: "../audio"

# File extensions (case-insensitive) considered audio input.
audio_extensions:
  - ".wav"
  - ".mp3"
  - ".m4a"
  - ".flac"
  - ".ogg"
  - ".aac"
  - ".wma"
  - ".opus"

# --- /asr request parameters ---

# Encode audio through ffmpeg on the server before transcription.
encode: true

# "transcribe" or "translate".
task: "transcribe"

# ISO-639-1 language code (e.g. "en"), or null to auto-detect.
language: ru

# Optional text to bias/prime the model with.
initial_prompt: null

# Voice activity detection filtering (faster_whisper engine only).
vad_filter: false

# Word-level timestamps (faster_whisper engine only).
word_timestamps: false

# Speaker diarization (whisperx engine only; also requires HF_TOKEN set on the server).
diarize: true

# Optional min/max number of speakers to hint the diarization pipeline with (whisperx only).
min_speakers: null
max_speakers: null

# Output format requested from the server: txt, vtt, srt, tsv, json.
# Kept as "txt" since results are saved as .txt files. Note that plain txt output does not
# include speaker labels even with diarize enabled -- use "json", "srt", or "vtt" to see them.
output_format: "txt"

# HTTP request timeout in seconds (transcription can take a while on CPU).
request_timeout_seconds: 12000
