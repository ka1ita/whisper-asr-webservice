version: "3.4"

# Compose file for the isolated server. Uses the pre-loaded image produced by
# build-offline-image.sh (docker load -i <tar> first) instead of building from source,
# since the isolated server has no internet access.
#
# Deliberately does not mount the asr_webservice_cache volume that docker-compose.yml uses for
# local dev - the models are already baked into the image at /root/.cache, and mounting an
# empty named volume over that path on a host where it was created previously (e.g. by an
# earlier plain docker run) would shadow them. See README.md for details.
#
# Edit ASR_ENGINE / ASR_MODEL below to match one of the models baked in by warmup_models.py.
services:
  asr-webservice:
    image: asr-webservice:offline
    # Restore the webservice entrypoint: images committed by build-offline-image.sh before
    # its docker-commit --change fix accidentally baked the warm-up container's
    # `sh -c "sleep infinity"` into the image, so they slept instead of serving.
    entrypoint: ["asr-webservice"]
    environment:
      - ASR_ENGINE=gigaam
      - ASR_MODEL=v3_ctc
      - ASR_REQUEST_LOGGING=true
      #- ASR_MODEL=v3_e2e_rnnt
      #- ASR_ENGINE=whisperx
      #- ASR_MODEL=tiny
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_DISABLE_TELEMETRY=true
      - HF_HUB_OFFLINE=true
    ports:
      - "9000:9000"
