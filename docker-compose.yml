version: "3.4"

services:
  asr-webservice:
    image: asr-webservice:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ./.env
        required: false
    environment:
      - ASR_ENGINE=gigaam
      - ASR_MODEL=v3_ctc
      - ASR_REQUEST_LOGGING=true
      #- ASR_MODEL=v3_e2e_rnnt
      #- ASR_ENGINE=whisperx
      #- ASR_MODEL=tiny
      - HF_TOKEN=${HF_TOKEN}
      - HF_HUB_DISABLE_TELEMETRY=true
      #- HF_HUB_OFFLINE=true
    ports:
      - "9000:9000"
    volumes:
      - ./app:/app/app
      - asr_webservice_cache:/root/.cache

  client:
    build:
      context: ./client
    profiles:
      - client
    depends_on:
      - asr-webservice
    environment:
      - ASR_CLIENT_SERVER_URL=http://asr-webservice:9000
      - ASR_CLIENT_AUDIO_DIR=/audio
    volumes:
      - ./audio:/audio

volumes:
  asr_webservice_cache:
